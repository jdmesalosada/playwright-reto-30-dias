name: Playwright Tests Updated
on:
  push:
    branches: [main, master]
  pull_request:
    branches : [main, master] 

  workflow_dispatch:
    inputs:
      grep: 
        description: "Campo opcional para filtrar los tests de playwright"
        required: false
        default: ''
        type: string
      project:
        description: "Selecciona el proyecto de playwright"
        required: true
        default: "admin"
        type: choice
        options:
          - admin
          - employee  
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: dev
    env:
      ADMIN_USERNAME: ${{vars.ADMIN_USERNAME}}
      ADMIN_PASSWORD: ${{secrets.ADMIN_PASSWORD}}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: |
        if [ -n "${{github.event.inputs.grep}}" ]; then
          npx playwright test --grep "${{github.event.inputs.grep}}" --project="${{github.event.inputs.project}}"
        else
          npx playwright test --project="${{github.event.inputs.project}}"
        fi  
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
